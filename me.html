<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Control</title>

<style>
body {
  font-family: Arial;
  background: #1a1a2e;
  color: #eee;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 96vh;
}

.card {
  background: #16213e;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  width: 300px;
}

.badge {
  padding: 6px 14px;
  border-radius: 20px;
  margin: 5px;
  display: inline-block;
  font-weight: bold;
}

.mode { background: #2980b9; }
.relay { background: #c0392b; }

button {
  margin: 10px;
  padding: 12px 25px;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  cursor: pointer;
}

.on  { background: green; color: white; }
.off { background: red; color: white; }
</style>
</head>

<body>

<div class="card">
  <h2>Smart Control</h2>

  <div>
    <span id="mode" class="badge mode">MODE: --</span>
    <span id="relay" class="badge relay">RELAY: --</span>
  </div>

  <div>
    <button class="on" onclick="setRelay(1)">ON</button>
    <button class="off" onclick="setRelay(0)">OFF</button>
  </div>
</div>

<script>

// ───────── التحكم في الريلاي بدون Refresh ─────────
function setRelay(state) {
  fetch(state ? "/on" : "/off")
    .then(() => updateStatus());
}

// ───────── جلب الحالة من ESP ─────────
function updateStatus() {
  fetch("/status")
    .then(res => res.json())
    .then(data => {

      document.getElementById("mode").innerText =
        "MODE: " + data.mode;

      document.getElementById("relay").innerText =
        "RELAY: " + data.relay;

      // تغيير اللون حسب الحالة
      document.getElementById("relay").style.background =
        data.relay === "ON" ? "#27ae60" : "#c0392b";

    })
    .catch(() => console.log("ESP not responding"));
}

// تحديث كل 2 ثانية (خفيف جدًا)
setInterval(updateStatus, 2000);

// أول تحميل
updateStatus();

</script>

</body>
