<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Choice</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family: Arial, Helvetica, sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
color:white;
overflow:hidden;

/* radial gradient background */

background: radial-gradient(circle at center,#0f2027,#000000 70%);
}

/* TEXT */

.text{
position:absolute;
text-align:center;
font-size:40px;
z-index:2;
text-shadow:
0 0 10px #00f7ff,
0 0 20px #00f7ff,
0 0 40px #00f7ff;
}

/* 3D AREA */

.scene{
perspective:800px;
}

/* ROTATING CIRCLE */

.circle{
width:200px;
height:200px;
border-radius:50%;
border:4px solid #00f7ff;

box-shadow:
0 0 20px #00f7ff,
0 0 40px #00f7ff,
0 0 80px #00f7ff;

animation:spin 6s linear infinite;

transform-style:preserve-3d;
}

/* ROTATION */

@keyframes spin{

0%{
transform:rotateX(0deg) rotateY(0deg);
}

50%{
transform:rotateX(180deg) rotateY(180deg);
}

100%{
transform:rotateX(360deg) rotateY(360deg);
}

}

</style>
</head>

<body>

<div class="text">
At the center… <br>
There is choice.
</div>

<div class="scene">
<div class="circle"></div>
</div>

</body>
</html>
