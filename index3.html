<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fear</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family: Arial, Helvetica, sans-serif;
}

body{
background-image: url(back.jpeg);
color:white;
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
overflow:hidden;
}

/* TITLE */

.title{
font-size:50px;
margin-bottom:80px;
position:relative;
animation: glitch 2s infinite;
}

/* GLITCH EFFECT */

@keyframes glitch{
0%{text-shadow:2px 0 red;}
20%{text-shadow:-2px 0 blue;}
40%{text-shadow:2px 0 lime;}
60%{text-shadow:-2px 0 purple;}
80%{text-shadow:2px 0 cyan;}
100%{text-shadow:none;}
}

/* FEAR TEXT */

.fear{
font-size:28px;
opacity:0;
position:absolute;
animation: showText 9s infinite;
}

/* SHAKE */

@keyframes shake{
0%{transform:translate(0)}
25%{transform:translate(-2px,2px)}
50%{transform:translate(2px,-2px)}
75%{transform:translate(-2px,2px)}
100%{transform:translate(0)}
}

/* APPEAR / DISAPPEAR */

@keyframes showText{

0%{opacity:0}

10%{
opacity:1;
animation:shake 0.4s infinite;
}

30%{opacity:1}

40%{opacity:0}

100%{opacity:0}

}

/* DELAY لكل جملة */

.text1{
animation-delay:0s;
}

.text2{
animation-delay:3s;
}

.text3{
animation-delay:6s;
}


.scroll-indicator{
position: fixed;
bottom: 30px;
left: 50%;
transform: translateX(-50%);
cursor: pointer;
}

.scroll-indicator span{
display: block;
width: 25px;
height: 25px;
border-bottom: 3px solid white;
border-right: 3px solid white;
transform: rotate(45deg);
animation: scroll 1.5s infinite;
}

@keyframes scroll{
0%{
opacity:0;
transform: rotate(45deg) translate(-10px,-10px);
}
50%{
opacity:1;
}
100%{
opacity:0;
transform: rotate(45deg) translate(10px,10px);
}
}

</style>
</head>

<body>

<h1 class="title">Fear lives in the shadows.</h1>

<div class="fear text1">“What if you fail?”</div>

<div class="fear text2">“What if they judge you?”</div>

<div class="fear text3">“What if you’re not enough?”</div>

 <a href="index4.html" class="scroll-indicator">
  <span></span>
</a>

</body>
</html>
